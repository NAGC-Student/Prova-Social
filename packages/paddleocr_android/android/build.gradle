plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'dev.nagcode.paddleocr'
version '1.0-SNAPSHOT'

android {
    namespace 'dev.nagcode.paddleocr'
    compileSdk 35

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
    // 4.5.3 ships an arm64 binary that references the removed
    // __sfp_handle_exceptions symbol on Android 16. Use the maintained
    // OpenCV Android artifact so PaddleOCR can initialize on current phones.
    implementation 'org.opencv:opencv:4.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
